  <path d="M 40 66 Q 50 74 60 66" stroke="#E57373" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="32" cy="60" r="5" fill="#FFB6C1" opacity="0.4"/>
  <circle cx="68" cy="60" r="5" fill="#FFB6C1" opacity="0.4"/>
  <!-- Smile wrinkles -->
  <path d="M 30 62 Q 32 65 30 68" stroke="#DEB887" stroke-width="1" fill="none"/>
  <path d="M 70 62 Q 68 65 70 68" stroke="#DEB887" stroke-width="1" fill="none"/>
