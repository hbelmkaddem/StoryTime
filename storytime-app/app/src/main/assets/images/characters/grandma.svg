<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grandmaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95A5A6"/>
      <stop offset="100%" style="stop-color:#7F8C8D"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#grandmaBg)"/>
  <!-- Face -->
  <circle cx="50" cy="55" r="26" fill="#FFE4C4"/>
  <!-- Gray hair in bun -->
  <ellipse cx="50" cy="35" rx="24" ry="18" fill="#D5D5D5"/>
  <circle cx="50" cy="22" r="12" fill="#D5D5D5"/>
  <ellipse cx="30" cy="45" rx="8" ry="12" fill="#D5D5D5"/>
  <ellipse cx="70" cy="45" rx="8" ry="12" fill="#D5D5D5"/>
  <!-- Glasses -->
  <circle cx="40" cy="52" r="10" stroke="#8B4513" stroke-width="2" fill="none"/>
  <circle cx="60" cy="52" r="10" stroke="#8B4513" stroke-width="2" fill="none"/>
  <line x1="50" y1="52" x2="50" y2="52" stroke="#8B4513" stroke-width="2"/>
  <path d="M 50 52 L 50 52" stroke="#8B4513" stroke-width="2"/>
  <line x1="30" y1="50" x2="22" y2="48" stroke="#8B4513" stroke-width="2"/>
  <line x1="70" y1="50" x2="78" y2="48" stroke="#8B4513" stroke-width="2"/>
