<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="princessBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63"/>
      <stop offset="100%" style="stop-color:#C2185B"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#princessBg)"/>
  <!-- Face -->
  <circle cx="50" cy="55" r="26" fill="#FFE4C4"/>
  <!-- Long hair -->
  <ellipse cx="50" cy="40" rx="28" ry="20" fill="#FFD54F"/>
  <ellipse cx="28" cy="55" rx="12" ry="25" fill="#FFD54F"/>
  <ellipse cx="72" cy="55" rx="12" ry="25" fill="#FFD54F"/>
  <ellipse cx="35" cy="75" rx="10" ry="15" fill="#FFD54F"/>
  <ellipse cx="65" cy="75" rx="10" ry="15" fill="#FFD54F"/>
  <!-- Crown -->
  <rect x="35" y="22" width="30" height="8" fill="#FFD700"/>
  <polygon points="35,22 40,12 45,22" fill="#FFD700"/>
  <polygon points="45,22 50,10 55,22" fill="#FFD700"/>
  <polygon points="55,22 60,12 65,22" fill="#FFD700"/>
  <!-- Gems on crown -->
  <circle cx="40" cy="17" r="2" fill="#E91E63"/>
  <circle cx="50" cy="15" r="3" fill="#E91E63"/>
  <circle cx="60" cy="17" r="2" fill="#E91E63"/>
  <!-- Eyes with lashes -->
  <ellipse cx="42" cy="52" rx="4" ry="5" fill="#4A4A4A"/>
  <ellipse cx="58" cy="52" rx="4" ry="5" fill="#4A4A4A"/>
