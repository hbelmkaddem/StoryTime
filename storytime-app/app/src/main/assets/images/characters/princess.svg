  <circle cx="59" cy="51" r="1.5" fill="white"/>
  <!-- Eyelashes -->
  <path d="M 38 48 L 36 45" stroke="#4A4A4A" stroke-width="1"/>
  <path d="M 40 47 L 39 44" stroke="#4A4A4A" stroke-width="1"/>
  <path d="M 60 47 L 61 44" stroke="#4A4A4A" stroke-width="1"/>
  <path d="M 62 48 L 64 45" stroke="#4A4A4A" stroke-width="1"/>
  <!-- Gentle smile -->
  <path d="M 44 62 Q 50 66 56 62" stroke="#E57373" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="34" cy="58" r="4" fill="#FFB6C1" opacity="0.5"/>
  <circle cx="66" cy="58" r="4" fill="#FFB6C1" opacity="0.5"/>
